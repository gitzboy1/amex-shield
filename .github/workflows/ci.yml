name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Lint with Black
      run: |
        cd backend
        black --check .

    - name: Check imports with isort
      run: |
        cd backend
        isort --check-only .

    - name: Run Django Tests (Dry run for now)
      run: |
        cd backend
        python manage.py check

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint Next.js
      run: |
        cd frontend
        npm run lint

    - name: Build Next.js
      run: |
        cd frontend
        npm run build
